name: Identity cache package acceptance
on:
  push:
    branches: [feat/project-independent-identity-cache]
    paths: [.github/workflows/identity-cache-packages.yml]
permissions:
  contents: read
jobs:
  packages:
    if: github.repository == 'lhj6102/ccdd'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Verify actual tarball installations without publishing
        shell: bash
        run: |
          set -euo pipefail
          npm run test:packages > "$RUNNER_TEMP/packages.log" 2>&1 || { cat "$RUNNER_TEMP/packages.log"; exit 1; }
          cat "$RUNNER_TEMP/packages.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-cache-packages-${{ github.sha }}
          path: ${{ runner.temp }}/packages.log
          retention-days: 7
