name: Identity cache workbench

on:
  push:
    branches: [feat/project-independent-identity-cache]
    paths: [.github/workflows/identity-cache-workbench.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package exact public source for integration testing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | gzip > "$RUNNER_TEMP/source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-cache-integration-source
          path: ${{ runner.temp }}/source
          if-no-files-found: error
          retention-days: 1

# Export the current integration head; remove this temporary workflow before merge.
