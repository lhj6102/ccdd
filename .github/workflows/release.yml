name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - packages/default-tools/package.json
      - .github/workflows/release.yml
      - scripts/release.mjs
      - scripts/verify-release.mjs
      - docs/releases/**
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - packages/default-tools/package.json
      - .github/workflows/release.yml
      - scripts/release.mjs
      - scripts/verify-release.mjs
      - test/release*.test.ts
      - docs/releases/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify release packages
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Check version and existing release
        id: plan
        run: node scripts/release.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install build dependencies
        if: steps.plan.outputs.should_build == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and typecheck
        if: steps.plan.outputs.should_build == 'true'
        run: npm run build
      - name: Run regression tests without Provider credentials
        if: steps.plan.outputs.should_build == 'true'
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-concurrency=4 dist/test/*.test.js | tee "$RUNNER_TEMP/release-tests.tap"
      - name: Pack and verify standalone installations
        if: steps.plan.outputs.should_build == 'true'
        run: >-
          node scripts/verify-release.mjs
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --source-commit "$GITHUB_SHA"
          --test-report "$RUNNER_TEMP/release-tests.tap"
          --output-dir "$RUNNER_TEMP/release-assets"
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
      - name: Keep verified packages for the publishing job
        if: steps.plan.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.plan.outputs.tag }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified GitHub Release
    needs: verify
    if: needs.verify.outputs.should_publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.verify.outputs.tag }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
      - name: Verify uploaded assets and publish
        run: node scripts/release.mjs publish --assets-dir "$RUNNER_TEMP/release-assets"
        env:
          GH_TOKEN: ${{ github.token }}
