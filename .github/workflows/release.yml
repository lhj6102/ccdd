name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with successful main CI
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: .release-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: node "$GITHUB_WORKSPACE/scripts/publish-ci.mjs" "$RUNNER_TEMP/release"
        working-directory: ${{ github.event_name == 'workflow_dispatch' && '.release-source' || '.' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CCDD_RELEASE_REF: refs/tags/${{ inputs.tag }}
