name: Identity cache source export
on:
  push:
    branches: [feat/project-independent-identity-cache]
    paths: [.github/workflows/identity-cache-source-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'lhj6102/ccdd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive HEAD | gzip > "$RUNNER_TEMP/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-cache-source
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/commit.txt
          retention-days: 1
